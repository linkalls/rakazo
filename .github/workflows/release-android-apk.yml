name: Build independent fork Android APK locally

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fork-android-release
  cancel-in-progress: false

jobs:
  apk:
    if: github.repository == 'linkalls/rakazo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      RAKAZO_FORK_APK: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set fork version code
        run: echo "RAKAZO_FORK_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify isolated fork configuration
        run: |
          set -euo pipefail
          (cd apps/mobile && node node_modules/expo/bin/cli config --type public --json) > "$RUNNER_TEMP/mobile-config.json"
          jq -e '.android.package == "com.linkalls.rakazo.fork" and .name == "Rakazo Fork" and .updates.enabled == false and (.extra.eas.projectId? == null)' "$RUNNER_TEMP/mobile-config.json"
      - name: Generate native Android project without EAS
        run: (cd apps/mobile && node node_modules/expo/bin/cli prebuild --platform android --no-install --clean)
      - name: Install the reusable fork signing certificate
        env:
          FORK_ANDROID_KEYSTORE_B64: ${{ secrets.FORK_ANDROID_KEYSTORE_B64 }}
          RAKAZO_FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FORK_ANDROID_KEYSTORE_B64"
          test -n "$RAKAZO_FORK_KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$FORK_ANDROID_KEYSTORE_B64" | base64 --decode > apps/mobile/android/app/fork-release.p12
          keytool -list -storetype PKCS12 -keystore apps/mobile/android/app/fork-release.p12 \
            -storepass "$RAKAZO_FORK_KEYSTORE_PASSWORD" -alias rakazofork > /dev/null
          node scripts/configure-fork-android-signing.mjs apps/mobile/android/app/build.gradle
      - name: Build locally with Gradle and the fixed fork signing key
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g
          RAKAZO_FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$apk"
          unzip -t "$apk" >/dev/null
          cp "$apk" "$RUNNER_TEMP/rakazo-fork.apk"
          (cd "$RUNNER_TEMP" && sha256sum rakazo-fork.apk > rakazo-fork.apk.sha256)
      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rakazo-fork-android-apk
          path: |
            ${{ runner.temp }}/rakazo-fork.apk
            ${{ runner.temp }}/rakazo-fork.apk.sha256
          if-no-files-found: error
      - name: Publish the fork APK without changing the desktop latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view fork-android > /dev/null 2>&1; then
            gh release upload fork-android "$RUNNER_TEMP/rakazo-fork.apk" "$RUNNER_TEMP/rakazo-fork.apk.sha256" --clobber
          else
            gh release create fork-android "$RUNNER_TEMP/rakazo-fork.apk" "$RUNNER_TEMP/rakazo-fork.apk.sha256" \
              --target "$GITHUB_SHA" --title "Rakazo Fork Android" \
              --notes "Standalone signed APK built entirely with local Gradle on GitHub Actions (no EAS Cloud). Package: com.linkalls.rakazo.fork. Dedicated stable fork signing key; install updates over the previous fork APK. Expo OTA disabled." \
              --latest=false
          fi
