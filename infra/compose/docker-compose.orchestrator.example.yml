# Apply this overlay to the official self-host image Compose file.
# Build the image from this fork's source at a pinned commit first.
# The base stack supplies storage, database, secrets, and service health checks.
services:
  api:
    image: rakazo/app:independent-groups
    environment:
      RAKAZO_BOT_ROLE_AUTOFILL: "true"
  worker:
    image: rakazo/app:independent-groups
    environment:
      RAKAZO_BOT_ROLE_AUTOFILL: "true"
      RAKAZO_GROUP_REVIEW_ENABLED: "true"
      RAKAZO_GROUP_HANDOFF_CONTEXT: "true"
      # Required: set to the *new rollout* UTC timestamp, never a historical date.
      RAKAZO_GROUP_REVIEW_SINCE: ${RAKAZO_GROUP_REVIEW_SINCE:?Set the UTC rollout cutoff}
  web:
    image: rakazo/app:independent-groups
